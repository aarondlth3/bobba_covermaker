<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#111114" name="theme-color"/>
<title>🖼️ Cover Design</title>
<style>
:root{
  color-scheme:dark;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#111114;color:#f3f3f5;
  --bg:#111114;--panel:#1b1b20;--control:#25252b;--line:#383840;
  --muted:#a0a0aa;--accent:#d4c8ff;--accent-bg:#383244
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{height:100vh;height:100dvh}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;max-width:1120px;margin:auto;padding:14px 20px 18px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font-size:21px;font-weight:760;letter-spacing:-.04em}
.top-actions{display:flex;align-items:center;gap:10px}
.badge{border:1px solid var(--line);border-radius:99px;color:#c9c0fa;padding:7px 10px;font-size:11px;white-space:nowrap}
.save-btn{border:0;background:var(--accent);color:#221d31;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:780;min-height:44px}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,390px);gap:25px}
.stage-wrap{min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.stage{
  position:relative;width:min(100%,580px,calc(100dvh - 155px));aspect-ratio:1;flex:none;
  border:1px solid #3b3b42;border-radius:12px;overflow:hidden;background:#151518;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab
}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#17171a;
  color:var(--muted);text-align:center;font-size:12px;line-height:1.5
}
.stage.ready .loading{display:none}
.stage-info{width:100%;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.layer-chip{display:flex;align-items:center;gap:6px}
.layer-chip span{color:#d9d0ff;font-weight:650}
.hint{color:var(--muted);font-size:11px}
.editor{min-height:0;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:5px;background:#1b1b20;border-bottom:1px solid var(--line);flex:none}
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-width:0;min-height:54px;border:0;border-radius:9px;background:transparent;
  color:#9898a4;font-size:11px;font-weight:650;padding:6px 2px
}
.nav-tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-tab.active{background:var(--accent-bg);color:#e8e0ff}
.editor-scroll{
  min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:#55545e transparent
}
.tab-panel{padding:19px 18px 22px;min-height:100%}
.panel-title{font-size:17px;font-weight:750;letter-spacing:-.025em;margin:0}
.panel-subtitle{font-size:11px;color:var(--muted);line-height:1.5;margin:5px 0 0}
.section{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
.section-heading{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:#9595a2;margin:0 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-weight:600}
.value{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.range{width:100%;height:30px;margin:9px 0 0;accent-color:#bbaafa;touch-action:pan-x}
.icon-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.icon-btn{
  min-height:42px;border:1px solid #474750;border-radius:10px;background:transparent;
  color:#d0d0d8;display:grid;place-items:center;padding:0
}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.active{border-color:#a999e8;background:var(--accent-bg);color:#eadfff}
.controls-grid{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,38px);gap:4px}
.pad button{
  border:1px solid #43434c;background:var(--control);color:#e7e7ec;border-radius:8px;
  font-size:18px;display:grid;place-items:center;padding:0
}
.pad svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .center{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}
.pad-info{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:11px}
.pad-tools{display:flex;flex-wrap:wrap;gap:8px}
.pad-tools .icon-btn{width:42px;min-width:42px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.mode{
  min-height:46px;padding:8px 5px;border:1px solid #484852;border-radius:9px;background:transparent;
  color:#bdbdc7;font-size:11px;font-weight:650
}
.mode.active{border-color:#a999e8;background:var(--accent-bg);color:#e8e0ff}
.color-panel{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;padding:13px;
  border:1px solid var(--line);border-radius:10px;background:#17171b
}
.color-label{font-size:12px;font-weight:650}
.swatches{display:flex;align-items:center;gap:9px;margin-top:12px}
.swatch{width:33px;height:33px;border:1px solid #666;border-radius:8px;padding:0}
.swatch.active{outline:2px solid #bbaafa;outline-offset:2px}
.color-input{width:45px;height:40px;padding:3px;border:1px solid #55555e;background:#26262c;border-radius:8px;cursor:pointer}
.hex{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:5px;text-align:center}
.description{color:var(--muted);font-size:11px;line-height:1.55;margin:12px 0 0}
.fixed{display:flex;align-items:flex-start;gap:9px;color:var(--muted);font-size:11px;line-height:1.5}
.fixed svg{width:18px;height:18px;flex:none;stroke:#bbaafa;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.status{min-height:18px;color:#a5a5b0;font-size:11px;line-height:1.5}
.note{font-size:11px;color:#85858f;line-height:1.55;margin-top:8px}
@media(max-width:690px), (max-height:500px) and (max-width:950px){
  .app{padding:8px 12px max(8px,env(safe-area-inset-bottom));gap:8px}
  .top{min-height:40px}
  .brand{font-size:19px}
  .badge{display:none}
  .save-btn{min-height:38px;padding:8px 16px;border-radius:16px;font-size:14px}
  .workspace{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:9px}
  .stage-wrap{justify-content:flex-start;gap:7px}
  .stage{width:min(100%,420px,max(135px,calc(100dvh - 295px)));border-radius:10px}
  .stage-info{gap:7px;font-size:10px;min-height:16px}
  .hint{font-size:10px}
  .editor{border-radius:11px;min-height:0}
  .tabbar{padding:4px}
  .nav-tab{min-height:50px}
  .tab-panel{padding:15px 16px 20px}
  .section{margin-top:16px;padding-top:16px}
}
@media(max-height:600px) and (max-width:690px), (max-height:500px) and (max-width:950px){
  .app{padding-top:5px;gap:5px}
  .top{min-height:34px}
  .stage{width:min(100%,420px,max(110px,calc(100dvh - 262px)))}
  .stage-wrap{gap:4px}
  .hint{display:none}
  .nav-tab{min-height:43px;flex-direction:row;gap:5px}
  .nav-tab svg{width:17px;height:17px}
}

/* Compact editing surface */
.tabbar{grid-template-columns:repeat(3,minmax(0,1fr))}
.nav-tab{min-height:42px;gap:0}
.nav-tab svg{width:21px;height:21px}
.tab-panel{padding-top:14px}
.first-section{border-top:0;margin-top:0;padding-top:0}
.visibility-control{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:15px;color:#e6e6ec;font-size:12px;font-weight:650;cursor:pointer}
.visibility-control input{position:absolute;opacity:0;width:1px;height:1px}
.switch-track{width:46px;height:28px;border-radius:99px;background:#4a4a54;border:1px solid #60606a;display:flex;align-items:center;padding:3px;transition:background .15s;flex:none}
.switch-thumb{width:20px;height:20px;background:#faf9ff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px #0005}
.visibility-control input:checked + .switch-track{background:#a997e5;border-color:#bbaafa}
.visibility-control input:checked + .switch-track .switch-thumb{transform:translateX(18px)}
.visibility-control input:focus-visible + .switch-track{outline:2px solid #d4c8ff;outline-offset:3px}
.icon-btn:focus-within{outline:2px solid #d4c8ff;outline-offset:3px}
button:disabled{opacity:.35}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:690px), (max-height:500px) and (max-width:950px){
 .nav-tab{min-height:40px;flex-direction:row}
 .nav-tab svg{width:22px;height:22px}
 .tab-panel{padding-top:12px}
 .stage{width:min(100%,420px,max(135px,calc(100dvh - 270px)))}
}
@media(max-height:600px) and (max-width:690px), (max-height:500px) and (max-width:950px){
 .stage{width:min(100%,420px,max(110px,calc(100dvh - 238px)))}
}
</style>

<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="favicon.png" rel="icon" sizes="64x64" type="image/png"/>
<link href="apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>
</head>
<body>
<main class="app" id="aa-editor">
<header class="top">
<div class="brand">🖼️ Cover Design</div>
<div class="top-actions">
<span class="badge">1000 × 1000 PNG</span>
<button class="save-btn" disabled="" id="save-btn" type="button">Guardar</button>
</div>
</header>
<div class="workspace">
<div class="stage-wrap">
<div class="stage" id="stage">
<canvas aria-label="Lienzo de portada. Arrastra para mover la capa seleccionada y usa dos dedos para escalar." height="1000" id="artboard" tabindex="0" width="1000"></canvas>
<div class="loading" id="loading">Cargando las capas de prueba…</div>
</div>
<div class="stage-info">
<div class="layer-chip">Moviendo: <span id="active-layer-label">Sujeto</span></div>
<div class="hint">Un dedo mueve · Dos dedos escalan · Paso fijo 5 px</div>
</div>
</div>
<div class="editor">
<nav aria-label="Secciones de edición" class="tabbar" role="tablist">



<button aria-controls="panel-background" aria-label="Fondo" aria-selected="false" class="nav-tab" data-tab="background" id="tab-background" role="tab" tabindex="-1" title="Fondo" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24"><rect height="16" rx="2" width="18" x="3" y="4"></rect><circle cx="8" cy="9" r="1.5"></circle><path d="m3 17 6-6 4 4 3-3 5 5"></path></svg>

</button><button aria-controls="panel-subject" aria-label="Sujeto" aria-selected="true" class="nav-tab active" data-tab="subject" id="tab-subject" role="tab" tabindex="0" title="Sujeto" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20v-2a7 7 0 0 1 14 0v2"></path></svg>

</button><button aria-controls="panel-letters" aria-label="Letras AA" aria-selected="false" class="nav-tab" data-tab="letters" id="tab-letters" role="tab" tabindex="-1" title="Letras AA" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24"><path d="m3 20 7-16 7 16M5.5 14h9M16 20l-2-5h7M18 8l3 7"></path></svg>

</button></nav>
<div class="editor-scroll" id="editor-scroll">
<section aria-labelledby="tab-subject" class="tab-panel" id="panel-subject" role="tabpanel"><label class="visibility-control" for="subject-enabled">
<span id="subject-visibility-label">Imagen con sujeto</span>
<input aria-label="Mostrar sujeto" checked="" id="subject-enabled" role="switch" type="checkbox"/>
<span aria-hidden="true" class="switch-track"><span class="switch-thumb"></span></span>
</label>


<div class="section first-section" style="border-top:0;margin-top:0;padding-top:0">

<div class="row"><span>Escala</span><span class="value" id="subject-scale-value">100 %</span></div>
<input aria-label="Escala del sujeto" class="range subject-transform" id="subject-scale" max="400" min="25" step="1" type="range" value="100"/>
<div class="icon-actions">
<button aria-label="Reducir tamaño del sujeto" class="icon-btn subject-transform" data-scale-minus="subject" title="Reducir" type="button">
<svg viewbox="0 0 24 24"><path d="M5 12h14"></path></svg>
</button>
<button aria-label="Restablecer sujeto" class="icon-btn subject-transform" data-reset="subject" title="Restablecer" type="button">
<svg viewbox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6"></path></svg>
</button>
<button aria-label="Aumentar tamaño del sujeto" class="icon-btn subject-transform" data-scale-plus="subject" title="Aumentar" type="button">
<svg viewbox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</div>
<div class="section">
<h3 class="section-heading">Ajustes rápidos</h3>
<div class="controls-grid">
<div aria-label="Posición precisa del sujeto" class="pad">
<button aria-label="Mover arriba" class="up subject-transform" data-move="up" type="button">
<svg viewbox="0 0 24 24"><path d="m12 6-5 5M12 6l5 5M12 6v12"></path></svg>
</button>
<button aria-label="Mover izquierda" class="left subject-transform" data-move="left" type="button">
<svg viewbox="0 0 24 24"><path d="m6 12 5-5M6 12l5 5M6 12h12"></path></svg>
</button>
<button aria-label="Centrar sujeto" class="center subject-transform" data-center="subject" type="button">
<svg viewbox="0 0 24 24"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>
</button>
<button aria-label="Mover derecha" class="right subject-transform" data-move="right" type="button">
<svg viewbox="0 0 24 24"><path d="m18 12-5-5M18 12l-5 5M6 12h12"></path></svg>
</button>
<button aria-label="Mover abajo" class="down subject-transform" data-move="down" type="button">
<svg viewbox="0 0 24 24"><path d="m12 18-5-5M12 18l5-5M12 6v12"></path></svg>
</button>
</div>
<div class="pad-info">
<div>Paso fijo: <span class="value">5 px</span></div>
<div class="pad-tools">
<label aria-label="Cargar sujeto" class="icon-btn" role="button" tabindex="0" title="Cargar sujeto">
<input accept="image/*" class="visually-hidden" id="subject-file" tabindex="-1" type="file"/>
<svg viewbox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 17v3h16v-3"></path></svg>
</label>
<button aria-label="Voltear sujeto horizontalmente" class="icon-btn subject-transform" id="flip-subject" title="Voltear sujeto" type="button">
<svg viewbox="0 0 24 24"><path d="M12 3v18M9 7 4 12l5 5M15 7l5 5-5 5"></path></svg>
</button>
</div>

</div>
</div>
</div>
</section>
<section aria-labelledby="tab-background" class="tab-panel" hidden="" id="panel-background" role="tabpanel">


<div class="section first-section" style="border-top:0;margin-top:0;padding-top:0">

<div class="row"><span>Escala</span><span class="value" id="background-scale-value">100 %</span></div>
<input aria-label="Escala del fondo" class="range background-transform" id="background-scale" max="800" min="100" step="1" type="range" value="100"/>
<div class="icon-actions">
<button aria-label="Reducir tamaño del fondo" class="icon-btn background-transform" data-scale-minus="background" title="Reducir" type="button">
<svg viewbox="0 0 24 24"><path d="M5 12h14"></path></svg>
</button>
<button aria-label="Restablecer fondo" class="icon-btn background-transform" data-reset="background" title="Restablecer" type="button">
<svg viewbox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6"></path></svg>
</button>
<button aria-label="Aumentar tamaño del fondo" class="icon-btn background-transform" data-scale-plus="background" title="Aumentar" type="button">
<svg viewbox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</div>
<div class="section">
<h3 class="section-heading">Desenfoque</h3>
<div class="row"><span>Blur del fondo</span><span class="value" id="blur-value">0 px</span></div>
<input aria-label="Desenfoque del fondo" class="range background-transform" id="blur" max="20" min="0" step="1" type="range" value="0"/>


</div>
<div class="section">
<h3 class="section-heading">Ajustes rápidos</h3>
<div class="controls-grid">
<div aria-label="Posición precisa del fondo" class="pad">
<button aria-label="Mover arriba" class="up background-transform" data-move="up" type="button">
<svg viewbox="0 0 24 24"><path d="m12 6-5 5M12 6l5 5M12 6v12"></path></svg>
</button>
<button aria-label="Mover izquierda" class="left background-transform" data-move="left" type="button">
<svg viewbox="0 0 24 24"><path d="m6 12 5-5M6 12l5 5M6 12h12"></path></svg>
</button>
<button aria-label="Centrar fondo" class="center background-transform" data-center="background" type="button">
<svg viewbox="0 0 24 24"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>
</button>
<button aria-label="Mover derecha" class="right background-transform" data-move="right" type="button">
<svg viewbox="0 0 24 24"><path d="m18 12-5-5M18 12l-5 5M6 12h12"></path></svg>
</button>
<button aria-label="Mover abajo" class="down background-transform" data-move="down" type="button">
<svg viewbox="0 0 24 24"><path d="m12 18-5-5M12 18l5-5M12 6v12"></path></svg>
</button>
</div>
<div class="pad-info">
<div>Paso fijo: <span class="value">5 px</span></div>
<div class="pad-tools">
<label aria-label="Cargar fondo" class="icon-btn" role="button" tabindex="0" title="Cargar fondo">
<input accept="image/*" class="visually-hidden" id="background-file" tabindex="-1" type="file"/>
<svg viewbox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 17v3h16v-3"></path></svg>
</label>
<button aria-label="Voltear fondo horizontalmente" class="icon-btn background-transform" id="flip-background" title="Voltear fondo" type="button">
<svg viewbox="0 0 24 24"><path d="M12 3v18M9 7 4 12l5 5M15 7l5 5-5 5"></path></svg>
</button>
</div>

</div>
</div>
</div>
</section>
<section aria-labelledby="tab-letters" class="tab-panel" hidden="" id="panel-letters" role="tabpanel">


<div class="section first-section" style="border-top:0;margin-top:0;padding-top:0">
<h3 class="section-heading">Composición</h3>
<div aria-label="Modo de las letras" class="modes" role="group">
<button aria-pressed="true" class="mode active" data-mode="solid" type="button">Color sólido</button>
<button aria-pressed="false" class="mode" data-mode="invert" type="button">Invertir</button>
<button aria-pressed="false" class="mode" data-mode="gray" type="button">Blanco y negro</button>
</div>
<div class="color-panel" id="color-panel">
<div>
<div class="color-label">Color de las letras</div>
<div class="swatches">
<button aria-label="Blanco" class="swatch active" data-color="#ffffff" style="background:#ffffff" title="Blanco" type="button"></button>
<button aria-label="Negro" class="swatch" data-color="#000000" style="background:#000000" title="Negro" type="button"></button>
<button aria-label="Crema" class="swatch" data-color="#d7c6aa" style="background:#d7c6aa" title="Crema" type="button"></button>
<button aria-label="Terracota" class="swatch" data-color="#c9574b" style="background:#c9574b" title="Terracota" type="button"></button>
</div>
</div>
<div>
<input aria-label="Elegir color personalizado" class="color-input" id="letter-color" type="color" value="#ffffff"/>
<div class="hex" id="hex-value">#FFFFFF</div>
</div>
</div>

</div>

</section>
</div>

</div>
</div>
<div aria-live="polite" class="visually-hidden" id="status" role="status"></div></main>
<script>

(() => {
  'use strict';
  const root = document.getElementById('aa-editor');
  if (!root || root.dataset.initialized) return;
  root.dataset.initialized = '1';


  const W = 1000, PREVIEW = 350, STEP = 5;
  const $ = id => root.querySelector('#' + id);
  const canvas = $('artboard');
  const status = $('status');
  canvas.width = canvas.height = PREVIEW;
  const ASSETS = {
    letters: 'images/letters.png',
    background: 'images/test_backg.png',
    subject: 'images/test_subject.png'
  };
  const state = {
    active:'subject', tab:'subject', mode:'solid', color:'#ffffff', blur:0,
    subjectEnabled:true, images:{}, layers:{}, pointers:new Map(), gesture:null,
    mask:null, maskVersion:0, backgroundVersion:0, frame:0, exporting:false
  };
  const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
  const message=text=>{status.textContent=text;};
  function makeCanvas(size){
    const c=document.createElement('canvas');c.width=c.height=size;return c;
  }
  function loadImage(url){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.crossOrigin='anonymous';
      img.onload=()=>img.naturalWidth&&img.naturalHeight?resolve(img):reject(new Error('Imagen vacía'));
      img.onerror=()=>reject(new Error('No se pudo cargar '+url));
      img.src=url;
    });
  }
  function makeLayer(img,key){
    const cover=Math.max(W/img.naturalWidth,W/img.naturalHeight);
    const base=key==='background'?cover:W*.80/img.naturalWidth;
    return {img,x:key==='background'?W*.5:W*.57,y:key==='background'?W*.5:W*.64,
      base,scale:base,min:key==='background'?cover:base*.25,
      max:key==='background'?cover*8:base*4,flipX:false};
  }
  function constrain(l,key){
    if(!l)return;
    l.scale=clamp(l.scale,l.min,l.max);
    if(key==='background'){
      const hw=l.img.naturalWidth*l.scale/2,hh=l.img.naturalHeight*l.scale/2;
      l.x=clamp(l.x,W-hw,hw);l.y=clamp(l.y,W-hh,hh);
    }else{
      l.x=clamp(l.x,-W*2,W*3);l.y=clamp(l.y,-W*2,W*3);
    }
  }
  function drawLayer(context,l,ratio){
    if(!l)return;
    const w=l.img.naturalWidth*l.scale,h=l.img.naturalHeight*l.scale;
    context.save();context.scale(ratio,ratio);context.translate(l.x,l.y);
    if(l.flipX)context.scale(-1,1);
    context.drawImage(l.img,-w/2,-h/2,w,h);context.restore();
  }
  function prepareMask(img){
    state.mask=img;state.maskVersion++;
    preview.invalidate();exportRenderer.invalidate();
  }
  function boxWidths(sigma){
    if(sigma<=0)return [];
    const n=3,ideal=Math.sqrt(12*sigma*sigma/n+1);
    let low=Math.floor(ideal);if(low%2===0)low--;low=Math.max(1,low);
    const high=low+2;
    const m=clamp(Math.round((12*sigma*sigma-n*low*low-4*n*low-3*n)/(-4*low-4)),0,n);
    return Array.from({length:n},(_,i)=>i<m?low:high);
  }
  function boxPass(src,dst,w,h,r,horizontal){
    const length=horizontal?w:h,lines=horizontal?h:w;
    const stride=horizontal?4:w*4,lineStride=horizontal?w*4:4;
    const sample=(start,index)=>start+clamp(index,0,length-1)*stride;
    for(let line=0;line<lines;line++){
      const start=line*lineStride;let sr=0,sg=0,sb=0;
      for(let j=-r;j<=r;j++){
        const p=sample(start,j);sr+=src[p];sg+=src[p+1];sb+=src[p+2];
      }
      const divisor=2*r+1;
      for(let x=0;x<length;x++){
        const p=start+x*stride;
        dst[p]=sr/divisor;dst[p+1]=sg/divisor;dst[p+2]=sb/divisor;dst[p+3]=255;
        const remove=sample(start,x-r),add=sample(start,x+r+1);
        sr+=src[add]-src[remove];sg+=src[add+1]-src[remove+1];sb+=src[add+2]-src[remove+2];
      }
    }
  }
  function blurPixels(data,size,sigma){
    if(sigma<=0)return data;
    let src=new Uint8ClampedArray(data),temp=new Uint8ClampedArray(data.length),dst=new Uint8ClampedArray(data.length);
    for(const width of boxWidths(sigma)){
      const r=(width-1)/2;if(r===0)continue;
      boxPass(src,temp,size,size,r,true);
      boxPass(temp,dst,size,size,r,false);
      const swap=src;src=dst;dst=swap;
    }
    return src;
  }
  function createRenderer(size,visibleCanvas){
    const ratio=size/W;
    const output=visibleCanvas||makeCanvas(size);
    const ctx=output.getContext('2d');
    const raw=makeCanvas(size),rawCtx=raw.getContext('2d',{willReadFrequently:true});
    const base=makeCanvas(size),baseCtx=base.getContext('2d',{willReadFrequently:true});
    const effect=makeCanvas(size),effectCtx=effect.getContext('2d',{willReadFrequently:true});
    const mask=makeCanvas(size),maskCtx=mask.getContext('2d',{willReadFrequently:true});
    let maskKey=-1,bgKey='',effectKey='',alpha=null;
    function invalidate(){maskKey=-1;bgKey='';effectKey='';}
    function prepare(){
      if(!state.mask||maskKey===state.maskVersion)return;
      maskCtx.clearRect(0,0,size,size);
      maskCtx.drawImage(state.mask,0,0,size,size);
      const data=maskCtx.getImageData(0,0,size,size).data;
      alpha=new Uint8Array(size*size);
      for(let i=0;i<alpha.length;i++)alpha[i]=data[i*4+3];
      maskKey=state.maskVersion;effectKey='';
    }
    function background(){
      const key=state.backgroundVersion+'|'+state.blur;
      if(key===bgKey)return;
      rawCtx.clearRect(0,0,size,size);
      rawCtx.fillStyle='#101013';rawCtx.fillRect(0,0,size,size);
      drawLayer(rawCtx,state.layers.background,ratio);
      baseCtx.clearRect(0,0,size,size);
      if(state.blur===0)baseCtx.drawImage(raw,0,0);
      else{
        const pixels=rawCtx.getImageData(0,0,size,size);
        pixels.data.set(blurPixels(pixels.data,size,state.blur*ratio));
        baseCtx.putImageData(pixels,0,0);
      }
      bgKey=key;effectKey='';
    }
    function letters(){
      if(!state.mask)return;
      prepare();
      const key=bgKey+'|'+maskKey+'|'+state.mode+'|'+state.color;
      if(key===effectKey)return;
      effectCtx.globalCompositeOperation='source-over';
      effectCtx.clearRect(0,0,size,size);
      if(state.mode==='solid'){
        effectCtx.fillStyle=state.color;effectCtx.fillRect(0,0,size,size);
        effectCtx.globalCompositeOperation='destination-in';
        effectCtx.drawImage(mask,0,0);
        effectCtx.globalCompositeOperation='source-over';
      }else{
        const pixels=baseCtx.getImageData(0,0,size,size),d=pixels.data;
        for(let i=0;i<alpha.length;i++){
          const p=i*4;
          if(!alpha[i]){d[p+3]=0;continue;}
          const r=d[p],g=d[p+1],b=d[p+2];
          if(state.mode==='invert'){
            d[p]=255-r;d[p+1]=255-g;d[p+2]=255-b;
          }else{
            const gray=Math.round(.2126*r+.7152*g+.0722*b);
            d[p]=d[p+1]=d[p+2]=gray;
          }
          d[p+3]=alpha[i];
        }
        effectCtx.putImageData(pixels,0,0);
      }
      effectKey=key;
    }
    function render(){
      background();letters();
      ctx.clearRect(0,0,size,size);ctx.drawImage(base,0,0);
      if(state.mask)ctx.drawImage(effect,0,0);
      if(state.subjectEnabled)drawLayer(ctx,state.layers.subject,ratio);
      return output;
    }
    return {render,invalidate,canvas:output};
  }
  const preview=createRenderer(PREVIEW,canvas);
  const exportRenderer=createRenderer(W);
  function render(){preview.render();}
  function scheduleRender(){
    if(state.frame)return;
    state.frame=requestAnimationFrame(()=>{state.frame=0;render();});
  }

  function refreshControls() {
    for (const key of ['subject', 'background']) {
      const layer = state.layers[key];
      if (!layer) continue;
      const pct = Math.round(layer.scale / layer.base * 100);
      $(key + '-scale').value = String(pct);
      $(key + '-scale-value').textContent = pct + ' %';
      const flipBtn = $('flip-' + key);
      if (flipBtn) flipBtn.classList.toggle('active', !!layer.flipX);
    }

    $('blur').value = String(state.blur);
    $('blur-value').textContent = state.blur + ' px';
    $('active-layer-label').textContent = state.active === 'subject' ? 'Sujeto' : 'Fondo';
    $('save-btn').disabled = state.exporting || !(state.mask && state.layers.background && (!state.subjectEnabled || state.layers.subject));
    $('subject-enabled').checked = state.subjectEnabled;
    $('subject-visibility-label').textContent = state.subjectEnabled ? 'Imagen con sujeto' : 'Imagen sin sujeto';
    root.querySelectorAll('.subject-transform').forEach(el => el.disabled = !state.subjectEnabled || !state.layers.subject);
    root.querySelectorAll('.background-transform').forEach(el => el.disabled = !state.layers.background);
    scheduleRender();
  }

  function changeLayer(key, mutator) {
    const layer = state.layers[key];
    if (!layer) return;
    mutator(layer);
    constrain(layer, key);
    if (key === 'background') state.backgroundVersion++;
    refreshControls();
  }

  function setScale(key, scale, anchor) {
    changeLayer(key, layer => {
      const old = layer.scale;
      layer.scale = clamp(scale, layer.min, layer.max);
      if (anchor && old > 0) {
        const ratio = layer.scale / old;
        layer.x = anchor.x + (layer.x - anchor.x) * ratio;
        layer.y = anchor.y + (layer.y - anchor.y) * ratio;
      }
    });
  }

  function move(key, dx, dy) {
    changeLayer(key, layer => {
      layer.x += dx;
      layer.y += dy;
    });
  }

  function resetLayer(key) {
    const layer = state.layers[key];
    if (!layer) return;
    state.layers[key] = makeLayer(layer.img, key);
    if (key === 'background') {
      state.blur = 0;
      state.backgroundVersion++;
    }
    refreshControls();
  }

  function setBlur(value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return;
    state.blur = clamp(Math.round(n), 0, 20);
    state.backgroundVersion++;
    refreshControls();
  }

  function setMode(mode) {
    if (!['solid', 'invert', 'gray'].includes(mode)) return;
    state.mode = mode;
    state.effectKey = '';
    root.querySelectorAll('[data-mode]').forEach(btn => {
      const on = btn.dataset.mode === mode;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', String(on));
    });
    $('color-panel').hidden = mode !== 'solid';
    scheduleRender();
  }

  function setColor(color) {
    if (!/^#[0-9a-f]{6}$/i.test(color)) return;
    state.color = color.toLowerCase();
    state.effectKey = '';
    $('letter-color').value = state.color;
    $('hex-value').textContent = state.color.toUpperCase();
    root.querySelectorAll('[data-color]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.color === state.color);
    });
    if (state.mode !== 'solid') setMode('solid');
    else scheduleRender();
  }

  function cancelGestures() {
    for (const id of state.pointers.keys()) {
      try { if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id); } catch {}
    }
    state.pointers.clear();
    state.gesture = null;
  }

  function setTab(tab, focus = false) {
    if (!['background', 'subject', 'letters'].includes(tab)) return;
    cancelGestures();
    state.tab = tab;
    if (tab === 'subject' || tab === 'background') state.active = tab === 'subject' && !state.subjectEnabled ? 'background' : tab;
    root.querySelectorAll('[data-tab]').forEach(btn => {
      const on = btn.dataset.tab === tab;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', String(on));
      btn.tabIndex = on ? 0 : -1;
    });
    root.querySelectorAll('.tab-panel').forEach(panel => {
      panel.hidden = panel.id !== 'panel-' + tab;
    });
    $('editor-scroll').scrollTop = 0;
    refreshControls();
    if (focus) $('tab-' + tab).focus();
  }

  root.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
    btn.addEventListener('keydown', e => {
      const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
      if (!keys.includes(e.key)) return;
      e.preventDefault();
      const tabs = ['background', 'subject', 'letters'];
      let i = tabs.indexOf(state.tab);
      if (e.key === 'Home') i = 0;
      else if (e.key === 'End') i = tabs.length - 1;
      else i = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
      setTab(tabs[i], true);
    });
  });

  root.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
  root.querySelectorAll('[data-color]').forEach(btn => btn.addEventListener('click', () => setColor(btn.dataset.color)));
  $('letter-color').addEventListener('input', e => setColor(e.target.value));

  for (const key of ['subject', 'background']) {
    $(key + '-scale').addEventListener('input', e => {
      const layer = state.layers[key];
      if (!layer) return;
      setScale(key, layer.base * Number(e.target.value) / 100, { x: W / 2, y: W / 2 });
    });
  }

  root.querySelectorAll('[data-scale-minus]').forEach(btn => btn.addEventListener('click', () => {
    const key = btn.dataset.scaleMinus;
    const layer = state.layers[key];
    if (!layer) return;
    setScale(key, layer.scale - layer.base * 0.01, { x: W / 2, y: W / 2 });
  }));

  root.querySelectorAll('[data-scale-plus]').forEach(btn => btn.addEventListener('click', () => {
    const key = btn.dataset.scalePlus;
    const layer = state.layers[key];
    if (!layer) return;
    setScale(key, layer.scale + layer.base * 0.01, { x: W / 2, y: W / 2 });
  }));

  root.querySelectorAll('[data-reset]').forEach(btn => btn.addEventListener('click', () => resetLayer(btn.dataset.reset)));
  root.querySelectorAll('[data-center]').forEach(btn => btn.addEventListener('click', () => {
    changeLayer(btn.dataset.center, layer => {
      layer.x = W / 2;
      layer.y = W / 2;
    });
  }));

  root.querySelectorAll('[data-move]').forEach(btn => btn.addEventListener('click', () => {
    const d = btn.dataset.move;
    move(state.active, d === 'left' ? -STEP : d === 'right' ? STEP : 0, d === 'up' ? -STEP : d === 'down' ? STEP : 0);
  }));

  $('subject-enabled').addEventListener('change', e => {
    state.subjectEnabled = e.target.checked;
    state.active = state.subjectEnabled ? 'subject' : 'background';
    cancelGestures();
    refreshControls();
  });
  root.querySelectorAll('.pad-tools label.icon-btn').forEach(label => {
    label.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        label.querySelector('input[type=file]').click();
      }
    });
  });
  $('flip-subject').addEventListener('click', () => changeLayer('subject', layer => { layer.flipX = !layer.flipX; }));
  $('flip-background').addEventListener('click', () => changeLayer('background', layer => { layer.flipX = !layer.flipX; }));
  $('blur').addEventListener('input', e => setBlur(e.target.value));


  function point(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * W / r.height };
  }

  function captureGesture() {
    const layer = state.layers[state.active];
    const points = [...state.pointers.values()];
    if (!layer || !points.length) {
      state.gesture = null;
      return;
    }
    const a = points[0], b = points[1] || a;
    state.gesture = {
      key: state.active,
      x: layer.x,
      y: layer.y,
      scale: layer.scale,
      mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
      distance: points.length > 1 ? Math.hypot(a.x - b.x, a.y - b.y) : 0
    };
  }

  function updateGesture() {
    const g = state.gesture;
    const points = [...state.pointers.values()];
    if (!g || !points.length) return;
    const layer = state.layers[g.key];
    if (!layer) return;

    const a = points[0], b = points[1] || a;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

    if (points.length > 1 && g.distance > 0) {
      layer.scale = clamp(g.scale * Math.hypot(a.x - b.x, a.y - b.y) / g.distance, layer.min, layer.max);
      const ratio = layer.scale / g.scale;
      layer.x = mid.x + (g.x - g.mid.x) * ratio;
      layer.y = mid.y + (g.y - g.mid.y) * ratio;
    } else {
      layer.x = g.x + mid.x - g.mid.x;
      layer.y = g.y + mid.y - g.mid.y;
    }

    constrain(layer, g.key);
    if (g.key === 'background') state.backgroundVersion++;
    refreshControls();
  }

  canvas.addEventListener('pointerdown', e => {
    if (!state.layers[state.active] || (state.active === 'subject' && !state.subjectEnabled)) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    state.pointers.set(e.pointerId, point(e));
    captureGesture();
  });

  canvas.addEventListener('pointermove', e => {
    if (!state.pointers.has(e.pointerId)) return;
    e.preventDefault();
    state.pointers.set(e.pointerId, point(e));
    updateGesture();
  });

  function endPointer(e) {
    if (!state.pointers.has(e.pointerId)) return;
    state.pointers.delete(e.pointerId);
    captureGesture();
  }

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('lostpointercapture', endPointer);

  canvas.addEventListener('wheel', e => {
    const layer = state.layers[state.active];
    if (!layer || (state.active === 'subject' && !state.subjectEnabled)) return;
    e.preventDefault();
    setScale(state.active, layer.scale * Math.exp(-e.deltaY * 0.001), point(e));
  }, { passive: false });

  canvas.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const n = e.shiftKey ? 10 : STEP;
    const d = { ArrowLeft: [-n, 0], ArrowRight: [n, 0], ArrowUp: [0, -n], ArrowDown: [0, n] }[e.key];
    if (d) {
      e.preventDefault();
      move(state.active, d[0], d[1]);
    }
  });

  async function replace(key, file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      message('Selecciona una imagen válida.');
      return;
    }
    if (file.size > 45 * 1024 * 1024) {
      message('El archivo supera el límite de 45 MB.');
      return;
    }
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);
      state.images[key] = img;
      state.layers[key] = makeLayer(img, key);
      if (key === 'subject') state.subjectEnabled = true;
      if (key === 'background') {
        state.blur = 0;
        state.backgroundVersion++;
      }
      state.backgroundKey = '';
      state.effectKey = '';
      setTab(key);
      message(key === 'subject' ? 'Sujeto reemplazado. Se conserva la transparencia del archivo.' : 'Fondo reemplazado.');
    } catch {
      message('No se pudo leer la imagen. Prueba con PNG, JPEG o WebP.');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  $('subject-file').addEventListener('change', e => {
    replace('subject', e.target.files[0]);
    e.target.value = '';
  });

  $('background-file').addEventListener('change', e => {
    replace('background', e.target.files[0]);
    e.target.value = '';
  });


  // Encode synchronously so the native share sheet is invoked within
  // the original tap gesture, including on mobile Safari.
  function captureBlob(){
    if(state.frame){cancelAnimationFrame(state.frame);state.frame=0;}
    const output=exportRenderer.render();
    const data=output.toDataURL('image/png').split(',')[1];
    const binary=atob(data),bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new Blob([bytes],{type:'image/png'});
  }
  function downloadBlob(blob,filename){
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }
  async function saveImage(){
    if(state.exporting||!state.mask||!state.layers.background||
       (state.subjectEnabled&&!state.layers.subject))return;
    state.exporting=true;refreshControls();
    const filename='cover-design-1000.png';
    try{
      const blob=captureBlob();
      if(typeof navigator.share==='function'&&typeof navigator.canShare==='function'&&typeof File!=='undefined'){
        const file=new File([blob],filename,{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          try{
            await navigator.share({files:[file],title:'Cover Design'});
            message('Imagen compartida.');
            return;
          }catch(e){
            if(e.name==='AbortError')return;
            // If native sharing is unavailable, preserve the finished PNG.
          }
        }
      }
      downloadBlob(blob,filename);
      message('PNG generado: 1000 × 1000 píxeles.');
    }catch(e){
      message(e.message||'No se pudo guardar la imagen.');
    }finally{
      state.exporting=false;refreshControls();
    }
  }

  $('save-btn').addEventListener('click', saveImage);

  async function init() {
    try {
      const letters = await loadImage(ASSETS.letters);
      state.images.letters = letters;
      prepareMask(letters);
    } catch {
      message('No se encontró images/letters.png. Comprueba que index.html esté en la raíz del repositorio.');
    }

    const results = await Promise.allSettled(['background', 'subject'].map(async key => [key, await loadImage(ASSETS[key])]));

    for (const item of results) {
      if (item.status === 'fulfilled') {
        const [key, img] = item.value;
        state.images[key] = img;
        state.layers[key] = makeLayer(img, key);
      }
    }

    if(!state.layers.subject){state.subjectEnabled=false;state.active='background';}
    $('stage').classList.add('ready');
    refreshControls();

    if (!state.mask) {
      message('No se encontró images/letters.png. Comprueba la ruta y vuelve a cargar la página.');
    } else if (!state.layers.background || !state.layers.subject) {
      message('Las AA están listas. Carga un fondo y un sujeto para comenzar.');
    } else {
      message('Editor listo.');
    }
  }

  init();
})();

</script>
</body>
</html>
